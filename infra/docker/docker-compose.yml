services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pisma
      POSTGRES_PASSWORD: pisma
      POSTGRES_DB: pisma
    ports:
      - "5432:5432"
    volumes:
      - pisma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pisma"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pisma_minio:/data
    profiles: ["full"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://pisma:pisma@postgres:5432/pisma
      STORAGE_LOCAL_PATH: /data/storage
    ports:
      - "3000:3000"
    volumes:
      - pisma_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  pisma_pg:
  pisma_minio:
  pisma_storage:
