<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PISMA v1.3 - Protótipo</title>
<style>
:root{--navy:#0d2740;--green:#1d6b4f;--blue:#246f9f;--amber:#b97918;--red:#b83c42;--ink:#1e293b;--muted:#64748b;--line:#dfe6ec;--bg:#f4f7f8;--card:#fff;--soft:#f8fafb}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#123a4f);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:6px}.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:900}.brand strong{font-size:16px}.brand small{display:block;color:#b8d0dd}.work{margin:16px 5px;padding:10px;border:1px solid #ffffff22;background:#ffffff0c;border-radius:10px}.nav{display:grid;gap:4px;margin-top:10px}.nav button{border:0;background:transparent;color:#dce8ef;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.top .tag{background:#eaf5f0;color:#175c45;padding:7px 10px;border-radius:999px;font-weight:700}.content{padding:25px;max-width:1550px;margin:auto}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.head h1{margin:0 0 4px;font-size:27px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #102a3b0a}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 18px}.kpi{padding:16px}.kpi label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}.kpi b{display:block;font-size:26px;margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{border:0;border-radius:9px;padding:10px 13px;min-height:40px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.success{background:var(--green);color:white}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:var(--red);color:#fff}.field{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:9px;background:white}.toolbar{padding:12px;display:flex;gap:8px;margin-bottom:12px}.toolbar .field{flex:1}.table{width:100%;border-collapse:collapse}.table th{background:#f7f9fa;color:var(--muted);font-size:11px;text-transform:uppercase;text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#e9f7f1;color:#196347}.amber{background:#fff6e6;color:#8b5a0b}.red{background:#feeeee;color:#962f36}.blue{background:#eaf3fb;color:#1f5e86}.gray{background:#f1f4f6;color:#56616e}.section{padding:17px;margin-bottom:12px}.section h3{margin:0 0 10px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:9px}.notice{padding:11px;border-left:4px solid var(--blue);background:#f2f8fc;border-radius:7px;margin-bottom:8px}.warning{border-left-color:var(--amber);background:#fffaf0}.critical{border-left-color:var(--red);background:#fff3f3}.screen{display:none}.screen.active{display:block}.screenpick{position:fixed;right:16px;bottom:16px;background:#0b1723;color:#fff;padding:9px;border-radius:10px;box-shadow:0 10px 28px #0003;z-index:99}.screenpick select{background:#162636;color:#fff;border:1px solid #314458;padding:7px;border-radius:7px}.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.node{padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700}.arrow{color:#94a3b8}.split{display:grid;grid-template-columns:2fr 1fr;gap:14px}.list{margin:0;padding-left:18px}.list li{margin:5px 0}.pillbar{display:flex;gap:6px;flex-wrap:wrap}.big-num{font-size:34px;font-weight:900}.mini-chart{height:130px;display:flex;align-items:end;gap:8px;padding:12px}.mini-chart i{display:block;flex:1;background:#cde6d9;border-radius:5px 5px 0 0}.mini-chart i:nth-child(2n){background:#bcd8ea}.mini-chart i:nth-child(3n){background:#ecd6a7}.offline{background:#fff7d8;border:1px solid #ead08a;padding:10px;border-radius:10px;color:#75510b}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.kpis,.grid3,.grid2,.split{grid-template-columns:1fr}.content{padding:15px}.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">P</div><div><strong>PISMA</strong><small>Segurança + Meio Ambiente</small></div></div><div class="work"><small>Obra ativa</small><br><b>Contrato Ilhéus</b></div><div class="nav" id="nav"></div></aside><div class="main"><header class="top"><div><b>Plataforma Integrada de Segurança e Meio Ambiente</b></div><div style="display:flex;gap:9px;align-items:center"><span class="tag">Rede interna • sincronizado</span><span class="badge gray">Gestor</span></div></header><div class="content" id="content"></div></div></div><div class="screenpick"><select id="pick"></select></div>
<script>
const screens={
'dashboard':()=>`<div class="head"><div><h1>Resumo Geral</h1><div class="muted">Visão integrada de segurança, operação e meio ambiente.</div></div><button class="btn ghost">Exportar indicadores</button></div><div class="kpis"><div class="card kpi"><label>PTs ativas</label><b>18</b><span class="badge green">15 normais</span> <span class="badge amber">3 perto do prazo</span></div><div class="card kpi"><label>PAC vencidas</label><b>4</b><span class="badge red">Requer atenção</span></div><div class="card kpi"><label>Audicamp no mês</label><b>126</b><span class="badge blue">+18% observações</span></div><div class="card kpi"><label>Resíduo perigoso</label><b>1,42 t</b><span class="badge gray">mês atual</span></div></div><div class="grid2"><div class="card section"><h3>Tendência preventiva</h3><div class="mini-chart"><i style="height:35%"></i><i style="height:51%"></i><i style="height:43%"></i><i style="height:66%"></i><i style="height:72%"></i><i style="height:61%"></i><i style="height:80%"></i></div><div class="muted">Audicamp, inspeções e RQA por semana.</div></div><div class="card section"><h3>Mural de Avisos</h3><div class="notice warning"><b>Treinamento vence em 7 dias</b><br>NR-35 • João Silva</div><div class="notice"><b>Procedimento atualizado</b><br>PR-EL-014 Rev.03 • resumo da mudança disponível</div><div class="notice critical"><b>PREA aberto</b><br>PREA-2026-000041 • Área de abastecimento</div></div></div>`,
'pt':()=>`<div class="head"><div><h1>Painel Operacional de PTs</h1><div class="muted">Visível para TST, Gestor e Supervisor.</div></div><button class="btn ghost">Imprimir selecionadas</button></div><div class="card toolbar"><input class="field" placeholder="Pesquisar OS, descrição, local, técnico ou TAG"><button class="btn ghost">Data</button><button class="btn ghost">Equipe</button><button class="btn ghost">Atividade</button></div><div class="card"><table class="table"><thead><tr><th></th><th>OS</th><th>Descrição</th><th>Local</th><th>Tipo</th><th>Equipe</th><th>Equipamentos</th><th>Validade</th><th>Status</th></tr></thead><tbody><tr><td>□</td><td><b>45821</b></td><td>Substituição de válvula</td><td>Casa de bombas</td><td><span class="badge amber">Quente</span></td><td>Téc. Mecânico + Soldador</td><td>TAG-SOL-044</td><td>02h14</td><td><span class="badge green">Em execução</span></td></tr><tr><td>□</td><td><b>45834</b></td><td>Inspeção QGBT</td><td>SE-02</td><td><span class="badge blue">Elétrica</span></td><td>Eletricista</td><td>TAG-MEG-013</td><td>00h48</td><td><span class="badge amber">Vence em breve</span></td></tr></tbody></table></div>`,
'apr':()=>`<div class="head"><div><h1>AR/APR Digital</h1><div class="muted">APR da tarefa derivada da biblioteca de riscos e vinculada à PT.</div></div><button class="btn primary">+ Nova APR</button></div><div class="flow"><span class="node">OS + Atividade</span><span class="arrow">→</span><span class="node">AR Base</span><span class="arrow">→</span><span class="node">APR da Tarefa</span><span class="arrow">→</span><span class="node">Risco Residual</span><span class="arrow">→</span><span class="node">Importar para PT</span></div><div class="card section" style="margin-top:14px"><h3>Etapa 03 • Remover flange</h3><div class="grid3"><div><label>Perigo</label><textarea class="field">Energia residual / pressão</textarea></div><div><label>Consequência</label><textarea class="field">Projeção de fluido e lesão</textarea></div><div><label>Controles existentes</label><textarea class="field">Bloqueio, drenagem e teste de energia zero</textarea></div></div><div class="grid3" style="margin-top:10px"><div><label>Probabilidade</label><select class="field"><option>2 - Improvável</option></select></div><div><label>Severidade</label><select class="field"><option>4 - Grave</option></select></div><div><label>Risco residual</label><div class="badge green" style="margin-top:9px">8 • Aceitável com controles</div></div></div></div>`,
'pgr':()=>`<div class="head"><div><h1>GRO / PGR</h1><div class="muted">Inventário de Riscos + Plano de Ação integrados às evidências da Obra.</div></div><button class="btn ghost">Gerar Inventário PDF</button></div><div class="kpis"><div class="card kpi"><label>Riscos ativos</label><b>64</b></div><div class="card kpi"><label>Alta prioridade</label><b>7</b></div><div class="card kpi"><label>Com recorrência</label><b>11</b></div><div class="card kpi"><label>Ações vinculadas</label><b>26</b></div></div><div class="card"><table class="table"><thead><tr><th>Código</th><th>Área / Processo</th><th>Risco</th><th>Funções</th><th>Evidências</th><th>Avaliação</th><th>Ação</th></tr></thead><tbody><tr><td>R-018</td><td>Oficina / Manutenção</td><td>Prensamento de mãos</td><td>Mecânico</td><td>3 RQA • 8 Audicamp • 2 APR</td><td><span class="badge red">Alto</span></td><td><span class="badge amber">PAC-00031</span></td></tr><tr><td>R-031</td><td>Pátio / Movimentação</td><td>Interação veículo-pedestre</td><td>Todos</td><td>4 Audicamp • 1 Inspeção</td><td><span class="badge amber">Médio</span></td><td>Monitorar</td></tr></tbody></table></div>`,
'pac':()=>`<div class="head"><div><h1>PAC • Plano Ação Corretiva</h1><div class="muted">Ação proporcional; responsável pela melhoria não equivale a atribuição de culpa.</div></div><button class="btn primary">+ Nova ação</button></div><div class="card toolbar"><input class="field" placeholder="Buscar PAC, origem ou tema"><button class="btn ghost">Vencidas</button><button class="btn ghost">Origem</button></div><div class="card"><table class="table"><thead><tr><th>PAC</th><th>Origem</th><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody><tr><td><b>PAC-00031</b></td><td>RQA-2026-00084</td><td>Implantar dispositivo de estabilização</td><td>Manutenção</td><td>20/08</td><td><span class="badge amber">Em execução</span></td></tr><tr><td><b>PAC-00026</b></td><td>Audicamp</td><td>Reforçar segregação do ponto de resíduos</td><td>Meio Ambiente</td><td>12/08</td><td><span class="badge red">Vencida</span></td></tr></tbody></table></div>`,
'audicamp':()=>`<div class="head"><div><h1>Audicamp</h1><div class="muted">Registro rápido de campo para qualquer usuário.</div></div><button class="btn primary">+ Registrar observação</button></div><div class="grid2"><div class="card section"><h3>Novo registro rápido</h3><label>Tipo</label><div class="pillbar"><span class="badge amber">Desvio</span><span class="badge green">Boa prática</span><span class="badge red">Risco iminente</span><span class="badge blue">Ambiental</span></div><br><label>Categoria FS 02-04</label><select class="field"><option>F - Ambiente de Trabalho Inadequado</option><option>B - EPI/Uso Inadequado</option><option>C - Posicionamento Errado</option></select><br><label>Subcategoria</label><select class="field"><option>F3 - Vazamento ou Derramamento</option></select><br><label>Descrição</label><textarea class="field" rows="4">Pequeno vazamento de óleo próximo à canaleta.</textarea><br><button class="btn ghost">Adicionar foto</button> <button class="btn success">Registrar</button></div><div class="card section"><h3>Triagem TST/Gestor</h3><div class="notice"><b>AUD-2026-00481</b><br>F3 • Vazamento / derramamento</div><div class="pillbar"><button class="btn ghost">Orientar e encerrar</button><button class="btn primary">Gerar PAC</button><button class="btn ghost">Escalar RQA</button></div><p class="muted">Nem todo desvio precisa gerar PAC.</p></div></div>`,
'inspections':()=>`<div class="head"><div><h1>Inspeções Digitais</h1><div class="muted">Templates versionados para área, andaime, escada, extintor, veículo e outros.</div></div><button class="btn primary">+ Novo template</button></div><div class="grid2"><div class="card section"><h3>Template • Inspeção de Escada</h3><div class="rows"><div class="row"><b>Degraus íntegros?</b><span>SIM/NÃO</span><span class="badge red">Bloqueante</span><span>Foto recomendada</span></div><div class="row"><b>Sapatas antiderrapantes?</b><span>SIM/NÃO/N/A</span><span class="badge gray">Normal</span><span>Sem foto</span></div><div class="row"><b>Identificação legível?</b><span>SIM/NÃO</span><span class="badge gray">Normal</span><span>Foto obrigatória</span></div></div></div><div class="card section"><h3>Execuções hoje</h3><div class="big-num">23</div><p><span class="badge green">20 conformes</span> <span class="badge amber">3 em triagem</span></p></div></div>`,
'competency':()=>`<div class="head"><div><h1>Matriz de Competência</h1><div class="muted">Regras configuradas por função, atividade e equipamento.</div></div><button class="btn primary">+ Regra</button></div><div class="card"><table class="table"><thead><tr><th>Função</th><th>Atividade</th><th>Requisito</th><th>Tipo</th><th>Bloqueante</th></tr></thead><tbody><tr><td>Eletricista</td><td>Eletricidade</td><td>NR-10 vigente</td><td>Treinamento</td><td><span class="badge red">Sim</span></td></tr><tr><td>Téc. Mecânico</td><td>Altura</td><td>NR-35 vigente</td><td>Treinamento</td><td><span class="badge red">Sim</span></td></tr><tr><td>Todos</td><td>Crítica</td><td>ASO válido</td><td>ASO</td><td><span class="badge red">Sim</span></td></tr></tbody></table></div><div class="offline" style="margin-top:12px"><b>Exemplo de bloqueio:</b> a PT só é bloqueada por requisito corporativo explicitamente configurado.</div>`,
'epi':()=>`<div class="head"><div><h1>EPI • Entrega e Termo Eletrônico</h1><div class="muted">TST/Gestor registra; Técnico apenas revisa e assina.</div></div><button class="btn primary">Registrar entrega</button></div><div class="card section"><div class="grid3"><div><label>Técnico</label><input class="field" value="João Silva"></div><div><label>Motivo</label><select class="field"><option>Troca</option></select></div><div><label>Data</label><input class="field" value="13/08/2026"></div></div><h3 style="margin-top:18px">Itens</h3><div class="rows"><div class="row"><span>Botina de segurança</span><span>CA 45678</span><span>Tamanho 42</span><span>Qtd 1</span></div><div class="row"><span>Luva anticorte</span><span>CA 32110</span><span>Tamanho G</span><span>Qtd 2</span></div></div><p><button class="btn ghost">Foto EPI antigo • recomendada</button> <button class="btn ghost">Foto EPI novo • recomendada</button></p><button class="btn success">Gerar termo para assinatura</button></div>`,
'equipment':()=>`<div class="head"><div><h1>Equipamentos e Checklists por TAG</h1><div class="muted">Cadastro por Supervisor/TST/Gestor. Checklist obrigatório antes da aprovação da PT.</div></div><button class="btn primary">+ Equipamento</button></div><div class="card"><table class="table"><thead><tr><th>TAG</th><th>Equipamento</th><th>Status</th><th>Inspeção</th><th>Certificado</th><th>Checklist</th></tr></thead><tbody><tr><td><b>TAG-SOL-044</b></td><td>Máquina de solda</td><td><span class="badge green">Disponível</span></td><td>Válida</td><td>N/A</td><td>8 perguntas</td></tr><tr><td><b>TAG-MEG-013</b></td><td>Megômetro</td><td><span class="badge green">Disponível</span></td><td>Válida</td><td><span class="badge amber">Calibra em 12d</span></td><td>5 perguntas</td></tr></tbody></table></div><div class="card section" style="margin-top:12px"><h3>Na PT • OS 45821</h3><div class="flow"><span class="node">Selecionar TAG</span><span class="arrow">→</span><span class="node">Checklist</span><span class="arrow">→</span><span class="node">Fotos obrigatórias</span><span class="arrow">→</span><span class="node">Pronto para aprovação</span></div></div>`,
'documents':()=>`<div class="head"><div><h1>Procedimentos e Documentos</h1><div class="muted">Acesso à versão vigente; revisões geram aviso individual.</div></div><button class="btn primary">Publicar revisão</button></div><div class="card"><table class="table"><thead><tr><th>Código</th><th>Documento</th><th>Revisão</th><th>Vigência</th><th>Status</th><th>Resumo da atualização</th></tr></thead><tbody><tr><td>PR-EL-014</td><td>Bloqueio e Teste de Energia</td><td>03</td><td>13/08/26</td><td><span class="badge green">Vigente</span></td><td>Novo passo de teste após drenagem.</td></tr><tr><td>PR-MEC-008</td><td>Intervenção em Flanges</td><td>05</td><td>04/07/26</td><td><span class="badge green">Vigente</span></td><td>Atualização de ferramentas permitidas.</td></tr></tbody></table></div>`,
'prea':()=>`<div class="head"><div><h1>PREA • Emergência Ambiental</h1><div class="muted">Qualquer usuário pode abrir; TST, Gestor e Supervisor são alertados.</div></div><button class="btn primary">+ Novo PREA</button></div><div class="split"><div class="card section"><div class="grid2"><div><label>Descrição do ocorrido</label><textarea class="field" rows="4">Derramamento de óleo hidráulico durante manutenção.</textarea></div><div><label>Medidas imediatas</label><textarea class="field" rows="4">Fonte isolada; absorvente aplicado; canaleta protegida.</textarea></div></div><h3>Evidências obrigatórias</h3><div class="pillbar"><span class="badge green">✓ Durante atendimento</span><span class="badge green">✓ Após tratamento</span><span class="badge green">✓ Local de depósito</span></div><h3>Resíduos gerados</h3><div class="row"><span>Absorvente contaminado</span><span>Classe/Tipo interno</span><span>38,5 kg</span><span class="badge blue">Enviado para Resíduos</span></div><h3>Conclusão</h3><textarea class="field" rows="3">Área limpa, sem vazamento ativo e resíduo segregado em recipiente identificado.</textarea></div><div class="card section"><h3>Aprovações</h3><p>TST <span class="badge green">Aprovado</span></p><p>Gestor <span class="badge amber">Pendente</span></p><button class="btn success">Assinar como Gestor</button><hr style="border:0;border-top:1px solid var(--line)"><p class="muted">Gestor pode substituir TST somente com ação separada e justificativa.</p></div></div>`,
'waste':()=>`<div class="head"><div><h1>Gestão de Resíduos</h1><div class="muted">Segregação por tipo/peso, solicitações de retirada e comprovantes.</div></div><button class="btn primary">+ Solicitação de retirada</button></div><div class="kpis"><div class="card kpi"><label>Perigosos aguardando</label><b>212 kg</b></div><div class="card kpi"><label>Retirados no mês</label><b>1,42 t</b></div><div class="card kpi"><label>Origem PREA</label><b>88 kg</b></div><div class="card kpi"><label>Solicitações abertas</label><b>3</b></div></div><div class="card"><table class="table"><thead><tr><th>Lote</th><th>Tipo</th><th>Origem</th><th>Peso</th><th>Armazenamento</th><th>Solicitação</th><th>Status</th></tr></thead><tbody><tr><td>RES-0084</td><td>Absorvente contaminado</td><td>PREA-00041</td><td>38,5 kg</td><td>Baia Classe I</td><td>SR-0021</td><td><span class="badge amber">Aguardando assinatura</span></td></tr><tr><td>RES-0081</td><td>Óleo usado</td><td>Rotina</td><td>160 kg</td><td>Tanque 03</td><td>SR-0020</td><td><span class="badge green">Retirada programada</span></td></tr></tbody></table></div>`,
'thirdparty':()=>`<div class="head"><div><h1>Terceiros / Contratadas</h1><div class="muted">Módulo habilitável pelo Master por Obra/Contrato.</div></div><span class="badge green">Habilitado neste contrato</span></div><div class="card"><table class="table"><thead><tr><th>Empresa</th><th>Contrato</th><th>Trabalhadores</th><th>Conformidade</th><th>Status</th></tr></thead><tbody><tr><td>ServMec Ltda</td><td>CT-044</td><td>18</td><td>17 aptos • 1 pendência</td><td><span class="badge green">Ativa</span></td></tr><tr><td>Elevatec</td><td>CT-051</td><td>7</td><td>7 aptos</td><td><span class="badge green">Ativa</span></td></tr></tbody></table></div>`,
'offline':()=>`<div class="head"><div><h1>PWA / Offline Controlado</h1><div class="muted">Rascunhos funcionam sem rede; assinaturas e aprovações permanecem online.</div></div></div><div class="offline"><b>Sem conexão.</b> Você pode continuar este Audicamp. O registro ficará <b>salvo neste dispositivo</b> até a sincronização.</div><div class="grid3" style="margin-top:14px"><div class="card section"><h3>Permitido offline</h3><ul class="list"><li>PT/APR em rascunho</li><li>Audicamp</li><li>Inspeções</li><li>Fotos em fila</li><li>Checklist equipamento</li></ul></div><div class="card section"><h3>Exige servidor</h3><ul class="list"><li>Assinar</li><li>Aprovar/reprovar</li><li>Submeter PT</li><li>Concluir RA</li><li>Aprovar PREA</li></ul></div><div class="card section"><h3>Fila</h3><p><span class="badge amber">3 aguardando sincronização</span></p><p class="muted">1 Audicamp • 1 inspeção • 1 foto</p></div></div>`
};
const order=[['dashboard','Resumo'],['pt','Painel PT'],['apr','AR/APR'],['pgr','GRO/PGR'],['pac','PAC'],['audicamp','Audicamp'],['inspections','Inspeções'],['competency','Competências'],['epi','EPI'],['equipment','Equipamentos'],['documents','Procedimentos'],['prea','PREA'],['waste','Resíduos'],['thirdparty','Terceiros'],['offline','PWA/Offline']];
function go(id){document.getElementById('content').innerHTML=screens[id]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.getElementById('pick').value=id;history.replaceState(null,'','?screen='+id)}
const nav=document.getElementById('nav'),pick=document.getElementById('pick');order.forEach(([id,n])=>{let b=document.createElement('button');b.textContent=n;b.dataset.id=id;b.onclick=()=>go(id);nav.appendChild(b);let o=document.createElement('option');o.value=id;o.textContent=n;pick.appendChild(o)});pick.onchange=e=>go(e.target.value);go(new URLSearchParams(location.search).get('screen')||'dashboard');
</script></body></html>
